[package]
name = "sippy"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Sippy SIP softphone using Rust and GPUI"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
gpui = "=0.2.2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
zbus = { version = "5", features = ["blocking-api"] }
unicode-segmentation = "1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
